[package]
name = "difi"
version = "0.1.0"
edition = "2021"
description = "Reference DIFI 1.1 (IEEE-ISTO Std 4900-2021) I/Q codec — independent Rust implementation"
license = "MIT OR Apache-2.0"

[lib]
name = "difi"
path = "src/lib.rs"

[[bin]]
name = "difi-tool"
path = "src/bin/difi_tool.rs"

[profile.release]
opt-level = 3
